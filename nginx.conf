server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    client_max_body_size 2m;
    include /etc/nginx/arkoplex-security-headers.conf;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/arkoplex-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Go backend
    location ^~ __BASE_PATH__/api/ {
        include /etc/nginx/arkoplex-security-headers.conf;
        proxy_pass http://127.0.0.1:4321/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "no-store" always;
    }

    # Redirect /api to /api/
    location = __BASE_PATH__/api {
        include /etc/nginx/arkoplex-security-headers.conf;
        return 301 __BASE_PATH__/api/;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:4321/api/health;
        proxy_read_timeout 3s;
    }

    # SPA routing
    location __BASE_PATH__/ {
        include /etc/nginx/arkoplex-security-headers.conf;
        try_files $uri $uri/ __BASE_PATH__/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}