name: ArkoPlex Android checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - uses: android-actions/setup-android@v3
      - name: Install fixed SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --filter pelagica...
      - name: Native session contract
        run: node --test scripts/check-android-contract.mjs
      - name: Build embedded UI and sync Android
        run: pnpm --filter pelagica run android:sync
      - name: Compile, test session lifecycle and lint Android
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Package APK, corresponding sources and notices
        run: scripts/package-android-test.sh "$RUNNER_TEMP/arkoplex-delivery"
      - uses: actions/upload-artifact@v4
        with:
          name: ArkoPlex-Android-debug
          path: ${{ runner.temp }}/arkoplex-delivery
          retention-days: 7
